name: Exchange calendar refresh

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/calendar_refresh.py"
      - "src/calendar_source_watch.py"
      - "src/calendar_sources/**"
      - "src/exporters/notion_calendar.py"
      - "config/calendar_sources.yaml"
      - ".github/workflows/calendar-refresh.yml"
  schedule:
    - cron: "0 0 * * 0"

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt

      - name: Restore previous source fingerprints
        uses: actions/cache@v4
        with:
          path: .calendar-cache/source_state.json
          key: calendar-source-state-${{ github.run_id }}
          restore-keys: |
            calendar-source-state-

      - name: Watch ICE and SGX official calendar sources
        run: |
          python -m src.calendar_source_watch \
            --state .calendar-cache/source_state.json \
            --report artifacts/calendar_source_watch.json

      - name: Refresh official exchange holiday coverage
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_CALENDAR_DATA_SOURCE_ID: "d9e7b145-64c9-462d-b56a-61dbc7502277"
          CME_API_ID: ${{ secrets.CME_API_ID }}
          CME_API_PASSWORD: ${{ secrets.CME_API_PASSWORD }}
        run: |
          python -m src.calendar_refresh \
            --output artifacts/exchange_calendar_refresh.json

      - uses: actions/upload-artifact@v4
        with:
          name: exchange-calendar-refresh
          path: |
            artifacts/exchange_calendar_refresh.json
            artifacts/calendar_source_watch.json
            artifacts/cme_trading_schedules.json
